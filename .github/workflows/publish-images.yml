name: Publish container images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository }}:build-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish aria2 image
        uses: docker/build-push-action@v6
        with:
          context: deploy/docker
          file: deploy/docker/Dockerfile.aria2
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository }}-aria2:build-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}

  publish-manifests:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-architecture tags
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          web="ghcr.io/${GITHUB_REPOSITORY}"
          aria2="ghcr.io/${GITHUB_REPOSITORY}-aria2"
          latest_tags=()
          aria2_latest_tags=()
          if [[ "$version" != *-* ]]; then
            latest_tags+=(--tag "$web:latest")
            aria2_latest_tags+=(--tag "$aria2:latest")
          fi
          docker buildx imagetools create \
            --tag "$web:$version" \
            "${latest_tags[@]}" \
            "$web:build-${GITHUB_SHA}-amd64" \
            "$web:build-${GITHUB_SHA}-arm64"
          docker buildx imagetools create \
            --tag "$aria2:$version" \
            "${aria2_latest_tags[@]}" \
            "$aria2:build-${GITHUB_SHA}-amd64" \
            "$aria2:build-${GITHUB_SHA}-arm64"
